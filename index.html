<html lang="en">
<head>

<style>
  :root{
    --bg:#0b0f0d; --surface:#131a17; --surface-2:#1b2420;
    --line:#243029; --text:#eef3f0; --dim:#8b9a92; --accent:#1db954;
    --radius:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text);
    font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    overscroll-behavior-y:contain;
  }
  .wrap{max-width:620px;margin:0 auto;padding:14px 14px 90px}

  header{display:flex;align-items:center;gap:10px;padding:8px 2px 16px}
  header h1{font-size:19px;font-weight:650;letter-spacing:-.02em;margin:0;flex:1}
  .iconbtn{
    background:var(--surface-2);border:1px solid var(--line);color:var(--text);
    width:44px;height:44px;border-radius:12px;font-size:18px;display:grid;place-items:center;cursor:pointer
  }
  .iconbtn:active{background:#243029}

  h2{font-size:12px;font-weight:650;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);margin:22px 2px 9px}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  .row{display:flex;gap:12px;padding:12px;align-items:center;border-bottom:1px solid var(--line);cursor:pointer}
  .row:last-child{border-bottom:none}
  .row:active{background:var(--surface-2)}
  .art{width:54px;height:54px;border-radius:8px;background:var(--surface-2);object-fit:cover;flex:none;
       display:grid;place-items:center;color:var(--dim);font-size:19px}
  .meta{flex:1;min-width:0}
  .t1{font-weight:600;font-size:15px;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .t2{color:var(--dim);font-size:13px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .t3{color:var(--dim);font-size:11.5px;margin-top:5px;font-variant-numeric:tabular-nums;display:flex;justify-content:space-between;gap:8px}
  .bar{height:3px;background:var(--surface-2);border-radius:2px;margin-top:7px;overflow:hidden}
  .bar>i{display:block;height:100%;background:var(--accent);border-radius:2px}
  .chev{color:var(--accent);font-size:22px;flex:none}
  .more{
    background:none;border:none;color:var(--dim);font-size:19px;cursor:pointer;
    width:44px;height:44px;flex:none;border-radius:11px;display:grid;place-items:center
  }
  .more:active{background:var(--surface-2);color:var(--text)}
  .dimmed{opacity:.55}
  h2 .count{float:right;letter-spacing:0;text-transform:none;font-weight:500}
  .chips{display:flex;gap:8px;margin-bottom:6px}
  .chip{flex:1;min-width:0;display:flex;align-items:center;gap:7px;background:var(--surface);
    border:1px solid var(--line);border-radius:11px;padding:0 12px;min-height:44px;
    font-size:12.5px;color:var(--dim);cursor:pointer}
  .chip b{color:var(--text);font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chip:active{background:var(--surface-2)}

  .empty{padding:26px 18px;text-align:center;color:var(--dim);font-size:14px}
  .empty b{display:block;color:var(--text);font-size:15px;margin-bottom:6px}

  button.primary{
    background:var(--accent);color:#04140c;border:none;border-radius:12px;
    padding:13px 20px;font-size:15px;font-weight:650;width:100%;cursor:pointer
  }
  button.primary:active{filter:brightness(.9)}
  button.ghost{background:var(--surface-2);border:1px solid var(--line);color:var(--text);
    border-radius:11px;padding:0 18px;min-height:44px;font-size:14.5px;font-weight:600;cursor:pointer}

  .signin{text-align:center;padding:56px 20px}
  .signin .mark{font-size:52px;margin-bottom:18px}
  .signin h3{font-size:21px;margin:0 0 10px;letter-spacing:-.02em}
  .signin p{color:var(--dim);font-size:14.5px;margin:0 0 26px}

  .toast{
    position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom));
    background:var(--surface-2);border:1px solid var(--line);color:var(--text);
    padding:11px 16px;border-radius:12px;font-size:13.5px;max-width:min(92vw,460px);
    box-shadow:0 10px 30px #0009;z-index:60;opacity:0;pointer-events:none;transition:opacity .18s
  }
  .toast.on{opacity:1}
  .toast.warn{border-color:#5a4a1e;color:#f2d98d}
  .toast{display:flex;align-items:center;gap:14px}
  .toast .undo{background:none;border:none;color:var(--accent);font-weight:700;
    font-size:14px;cursor:pointer;padding:6px 2px;flex:none}

  dialog{
    border:none;padding:0;background:var(--bg);color:var(--text);width:100%;max-width:620px;
    height:100%;max-height:100%;margin:0 auto
  }
  dialog::backdrop{background:#000c}
  .sheet{display:flex;flex-direction:column;height:100dvh}
  .sheethead{display:flex;gap:10px;align-items:center;padding:4px 14px 14px;border-bottom:1px solid var(--line)}
  .grabber{padding:10px 0 6px;display:grid;place-items:center;touch-action:none;cursor:grab}
  .grabber::after{content:"";width:38px;height:5px;border-radius:3px;background:var(--line);display:block}
  .sheetfoot{
    padding:10px 14px calc(10px + env(safe-area-inset-bottom));
    border-top:1px solid var(--line);background:var(--bg)
  }
  .sheethead h3{margin:0;font-size:17px;flex:1;letter-spacing:-.01em}
  .sheetbody{flex:1;overflow-y:auto;padding:14px;-webkit-overflow-scrolling:touch}
  input[type=search],input[type=text]{
    width:100%;background:var(--surface);border:1px solid var(--line);color:var(--text);
    border-radius:11px;padding:12px 14px;font-size:15px;outline:none
  }
  input:focus{border-color:var(--accent)}
  .addbtn{background:none;border:none;color:var(--accent);font-size:25px;cursor:pointer;padding:0 4px}
  .tick{color:var(--accent);font-size:19px}
  .seg{display:flex;gap:6px;margin:10px 0 4px}
  .seg button{flex:1;background:var(--surface);border:1px solid var(--line);color:var(--dim);
    padding:9px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer}
  .seg button.on{background:var(--surface-2);color:var(--text);border-color:var(--accent)}
  .hint{color:var(--dim);font-size:12.5px;margin:9px 2px 0;line-height:1.5}
  .center{display:flex;justify-content:center;padding:16px}

  .target{
    display:flex;align-items:center;gap:9px;background:var(--surface);
    border:1px solid var(--line);border-radius:11px;padding:10px 13px;
    font-size:13px;color:var(--dim);cursor:pointer;margin-bottom:4px
  }
  .target b{color:var(--text);font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .target .edit{color:var(--accent);font-weight:600}
  .target:active{background:var(--surface-2)}
</style>

<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>

<dialog id="sheet"><div class="sheet">
  <div class="grabber" id="grabber"></div>
  <div class="sheethead"><h3 id="sheetTitle">Watchlist</h3></div>
  <div class="sheetbody" id="sheetBody"></div>
  <div class="sheetfoot"><button class="primary" onclick="closeSheet()">Done</button></div>
</div></dialog>

<script>
/* ════════════════════════════════════════════════════════════
   CONFIG — paste your Spotify Client ID below.
   The redirect URI is this page's own URL; register it verbatim
   in the Spotify dashboard.
   ════════════════════════════════════════════════════════════ */
const CLIENT_ID = 'PASTE_YOUR_SPOTIFY_CLIENT_ID';

const REDIRECT_URI = location.origin + location.pathname;
const SCOPES = 'user-read-playback-state user-modify-playback-state user-read-currently-playing user-read-recently-played';
const API = 'https://api.spotify.com';

/* ── Storage ──────────────────────────────────────────────── */
const DB = (() => {
  let ok = true, mem = {};
  try { localStorage.setItem('_t','1'); localStorage.removeItem('_t'); }
  catch (e) { ok = false; }
  return {
    ok,
    get(k, d) {
      try {
        const v = ok ? localStorage.getItem(k) : mem[k];
        return v == null ? d : JSON.parse(v);
      } catch (e) { return d; }
    },
    set(k, v) {
      const s = JSON.stringify(v);
      if (ok) { try { localStorage.setItem(k, s); } catch (e) {} } else mem[k] = s;
    },
    del(k) { if (ok) localStorage.removeItem(k); else delete mem[k]; }
  };
})();

const ARCHIVE_AT = 0.97;          // album fraction that counts as finished
const HISTORY_CAP = 24;
const HISTORY_GAP_MS = 4 * 60 * 1000;

let state = {
  bookmarks: DB.get('bookmarks', []),
  watchlist: DB.get('watchlist', []),
  mode:      DB.get('mode', 'everything'),
  profiles:  DB.get('profiles', ['Me']),
  profile:   DB.get('profile', 'Me'),   // per-device, deliberately not synced
  nowPlaying: null,
  signedIn: false,
  busy: false,
  showArchived: false
};

/* Bookmarks used to be keyed by album URI alone. Profiles need the owner in the
   key, so anything predating them is adopted by the current profile. */
(function migrate() {
  let touched = false;
  for (const b of state.bookmarks) {
    if (!b.profile) {
      b.profile = state.profile;
      b.key = b.id;
      b.id = b.profile + '::' + b.key;
      b.history = b.history || [];
      b.archived = !!b.archived;
      touched = true;
    }
  }
  if (touched) DB.set('bookmarks', state.bookmarks);
})();
const save = (opts) => {
  DB.set('bookmarks', state.bookmarks);
  DB.set('watchlist', state.watchlist);
  DB.set('mode', state.mode);
  DB.set('profiles', state.profiles);
  DB.set('profile', state.profile);
  if (!opts?.noSync) scheduleSync();
};

// Deletions need to travel too, otherwise the other device just puts the row back
// on the next merge. A tombstone outranks any entry older than itself.
function tombstone(id) {
  const t = DB.get('tombstones', {});
  t[id] = new Date().toISOString();
  DB.set('tombstones', t);
}

/* ── Helpers ──────────────────────────────────────────────── */
const clock = ms => {
  const t = Math.max(0, Math.floor(ms / 1000));
  const h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), s = t % 60;
  return h ? `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`
           : `${m}:${String(s).padStart(2,'0')}`;
};
const ago = iso => {
  const d = (Date.now() - new Date(iso)) / 1000;
  if (d < 90) return 'just now';
  if (d < 3600) return Math.round(d / 60) + 'm ago';
  if (d < 86400) return Math.round(d / 3600) + 'h ago';
  return Math.round(d / 86400) + 'd ago';
};
const wallClock = iso => new Date(iso)
  .toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
const dayLabel = iso => {
  const d = new Date(iso), t = new Date();
  if (d.toDateString() === t.toDateString()) return 'Today';
  if (new Date(t - 864e5).toDateString() === d.toDateString()) return 'Yesterday';
  return d.toLocaleDateString([], { day: 'numeric', month: 'short' });
};
const t2n = s => new Date(s || 0).getTime();
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let toastTimer;
function toast(msg, warn, action) {
  const el = document.getElementById('toast');
  el.innerHTML = `<span>${esc(msg)}</span>` +
    (action ? `<button class="undo">${esc(action.label)}</button>` : '');
  if (action) el.querySelector('.undo').onclick = () => { el.className = 'toast'; action.run(); };
  el.className = 'toast on' + (warn ? ' warn' : '');
  el.style.pointerEvents = action ? 'auto' : 'none';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.className = 'toast', action ? 7000 : 3600);
}

/* ── PKCE auth ────────────────────────────────────────────── */
const b64url = buf => btoa(String.fromCharCode(...new Uint8Array(buf)))
  .replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');

async function signIn() {
  if (CLIENT_ID.startsWith('PASTE')) {
    return toast('Set CLIENT_ID at the top of index.html first.', true);
  }
  const bytes = new Uint8Array(64);
  crypto.getRandomValues(bytes);
  const verifier = b64url(bytes);
  DB.set('verifier', verifier);

  const challenge = b64url(
    await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier))
  );
  const q = new URLSearchParams({
    client_id: CLIENT_ID, response_type: 'code', redirect_uri: REDIRECT_URI,
    code_challenge_method: 'S256', code_challenge: challenge, scope: SCOPES
  });
  location.href = 'https://accounts.spotify.com/authorize?' + q;
}

async function tokenRequest(body) {
  const r = await fetch('https://accounts.spotify.com/api/token', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: new URLSearchParams(body)
  });
  const j = await r.json();
  if (!r.ok) {
    if (r.status === 400 || r.status === 401) signOut(true);
    throw new Error(j.error_description || j.error || 'Token request failed');
  }
  DB.set('access', j.access_token);
  DB.set('expires', Date.now() + (j.expires_in - 60) * 1000);
  if (j.refresh_token) DB.set('refresh', j.refresh_token);
  state.signedIn = true;
}

async function handleRedirect() {
  const p = new URLSearchParams(location.search);
  if (p.get('error')) {
    history.replaceState({}, '', REDIRECT_URI);
    toast('Spotify sign-in was cancelled.', true);
    return;
  }
  const code = p.get('code');
  if (!code) return;
  const verifier = DB.get('verifier');
  history.replaceState({}, '', REDIRECT_URI);
  if (!verifier) return;
  try {
    await tokenRequest({
      grant_type: 'authorization_code', code, redirect_uri: REDIRECT_URI,
      client_id: CLIENT_ID, code_verifier: verifier
    });
    DB.del('verifier');
  } catch (e) { toast(e.message, true); }
}

async function token() {
  const access = DB.get('access'), expires = DB.get('expires', 0);
  if (access && Date.now() < expires) return access;
  const refresh = DB.get('refresh');
  if (!refresh) throw new Error('NOT_SIGNED_IN');
  await tokenRequest({ grant_type: 'refresh_token', refresh_token: refresh, client_id: CLIENT_ID });
  return DB.get('access');
}

function signOut(quiet) {
  ['access','expires','refresh','verifier'].forEach(DB.del);
  state.signedIn = false;
  state.nowPlaying = null;
  stopPolling();
  render();
  if (!quiet) toast('Signed out.');
}

/* ── API ──────────────────────────────────────────────────── */
async function api(path, method = 'GET', body) {
  const t = await token();
  const r = await fetch(API + path, {
    method,
    headers: { Authorization: 'Bearer ' + t, ...(body ? {'Content-Type':'application/json'} : {}) },
    body: body ? JSON.stringify(body) : undefined
  });
  if (r.status === 204) return null;
  const text = await r.text();
  const data = text ? JSON.parse(text) : null;
  if (!r.ok) {
    const err = new Error(data?.error?.message || r.statusText);
    err.status = r.status;
    throw err;
  }
  return data;
}

/* ── Bookmarks ────────────────────────────────────────────── */
function watchMatches(np) {
  return state.watchlist.some(w => {
    const hay = (s, n) => (s || '').toLowerCase().includes(n.toLowerCase());
    if (w.kind === 'artist') return w.uri === np.artistURI || hay(np.artistName, w.name);
    if (w.kind === 'album')  return w.uri === np.albumURI || w.uri === np.contextURI;
    return hay(np.albumName, w.name) || hay(np.artistName, w.name) || hay(np.trackName, w.name);
  });
}

/** A rolling trail of positions, so an accidental all-night playthrough is undoable. */
function pushHistory(history, entry) {
  const list = [...(history || [])];
  const sample = { t: entry.updatedAt, p: entry.positionMs, u: entry.trackURI, n: entry.trackNumber };
  const last = list[list.length - 1];
  if (last && last.u === sample.u && t2n(sample.t) - t2n(last.t) < HISTORY_GAP_MS) {
    list[list.length - 1] = sample;      // same chapter, recent: replace
  } else {
    list.push(sample);
  }
  return list.slice(-HISTORY_CAP);
}

function record(np) {
  if (state.mode === 'watchlist' && !watchMatches(np)) return;
  // A podcast episode stands alone. An audiobook or Hörspiel is one bookmark for
  // the whole thing, so its many chapters collapse into a single row.
  const key = np.kind === 'episode'
    ? np.trackURI
    : (np.contextURI || np.albumURI || np.trackURI);
  const id = state.profile + '::' + key;
  const tomb = DB.get('tombstones', {});

  const entry = { id, profile: state.profile, key,
                  albumName: np.albumName, artistName: np.artistName, art: np.art,
                  albumURI: np.albumURI, kind: np.kind || 'track',
                  contextURI: np.contextURI, trackURI: np.trackURI, trackName: np.trackName,
                  trackNumber: np.trackNumber, positionMs: np.positionMs,
                  durationMs: np.durationMs, updatedAt: new Date().toISOString(),
                  archived: false, history: [] };

  const i = state.bookmarks.findIndex(b => b.id === id);
  if (i >= 0) {
    const old = state.bookmarks[i];
    // Don't let a fresh restart at 0:01 clobber a good position.
    if (old.trackURI === entry.trackURI && entry.positionMs < 3000 && old.positionMs > 10000) return;
    // Don't resurrect something deleted on another device.
    if (tomb[id] && t2n(tomb[id]) >= t2n(old.updatedAt)) return;
    entry.history = pushHistory(old.history, entry);
    state.bookmarks[i] = entry;
  } else {
    if (np.positionMs < 3000 && !np.isPlaying) return;
    entry.history = pushHistory([], entry);
    state.bookmarks.push(entry);
  }
  state.bookmarks.sort((a, b) => t2n(b.updatedAt) - t2n(a.updatedAt));
  save();
}

/** Only the current profile's bookmarks. */
const mine = () => state.bookmarks.filter(b => (b.profile || 'Me') === state.profile);

/** Every profile we know of: the synced list, plus any owner seen on a bookmark.
    A device that has only just pulled the gist can pick a profile it never typed. */
function knownProfiles() {
  return [...new Set([
    ...state.profiles,
    ...state.bookmarks.map(b => b.profile).filter(Boolean),
    state.profile,
    'Me'
  ])].sort((a, b) => a.localeCompare(b));
}

/* ── Album track maps ─────────────────────────────────────────
   A 40-track Hörspiel needs its full track list before "how far in
   am I" means anything. Albums never change, so this is cached
   locally forever and never synced.
   ──────────────────────────────────────────────────────────── */
const albumCache = () => DB.get('albums', {});
let albumFetching = false;

/** Which endpoint lists the parts of this thing. Podcasts are excluded on
    purpose — "62% through a podcast series" is meaningless; an episode's own
    progress is what matters. */
function partsEndpoint(uri) {
  const [, kind, id] = (uri || '').split(':');
  if (kind === 'album')     return `/v1/albums/${id}/tracks`;
  if (kind === 'audiobook') return `/v1/audiobooks/${id}/chapters`;
  return null;
}

async function fetchContainer(uri) {
  const cache = albumCache();
  if (cache[uri]) return cache[uri].failed ? null : cache[uri];

  const endpoint = partsEndpoint(uri);
  if (!endpoint) return null;

  const parts = {};
  let total = 0, offset = 0, count = 0;
  try {
    while (offset < 400) {
      const page = await api(`${endpoint}?limit=50&offset=${offset}`);
      const items = page?.items || [];
      for (const t of items) {
        parts[t.uri] = { o: total, i: t.track_number ?? t.chapter_number ?? (count + 1) };
        total += t.duration_ms || 0;
        count++;
      }
      if (items.length < 50) break;
      offset += 50;
    }
  } catch (e) {
    // Remember the failure, or warmAlbums retries it on every single render.
    cache[uri] = { failed: true, at: Date.now() };
    DB.set('albums', cache);
    return null;
  }
  if (!count) {
    cache[uri] = { failed: true, at: Date.now() };
    DB.set('albums', cache);
    return null;
  }

  cache[uri] = { totalMs: total, tracks: parts, count, at: Date.now() };
  DB.set('albums', cache);
  return cache[uri];
}

/** The album or audiobook a bookmark belongs to. Falls back to albumURI for
    anything played straight from search, which has no context. */
const containerOf = b =>
  [b.contextURI, b.albumURI].find(u => partsEndpoint(u)) || null;

/** Album-level progress, or null while the track map is still unknown. */
function progressOf(b) {
  // Podcast episodes stand alone — progress is through the episode itself.
  if (b.kind === 'episode') {
    if (!b.durationMs) return null;
    return { elapsed: b.positionMs, total: b.durationMs,
             fraction: Math.min(1, b.positionMs / b.durationMs),
             chapter: null, chapters: null };
  }
  const meta = albumCache()[containerOf(b) || ''];
  const hit = meta?.tracks?.[b.trackURI];
  if (!meta?.totalMs || !hit) return null;
  const elapsed = hit.o + b.positionMs;
  return { elapsed, total: meta.totalMs,
           fraction: Math.min(1, elapsed / meta.totalMs),
           chapter: hit.i, chapters: meta.count };
}

/** Pulls missing track maps a few at a time, then re-renders. */
async function warmAlbums() {
  if (albumFetching) return;
  const cache = albumCache();
  const missing = [...new Set(
    state.bookmarks.map(containerOf).filter(u => u && !cache[u])
  )].slice(0, 3);
  if (!missing.length) return;

  albumFetching = true;
  for (const uri of missing) {
    try { await fetchContainer(uri); } catch (e) { break; }
  }
  albumFetching = false;
  autoArchive();
  render();
}

/** Anything effectively finished drops out of the main list on its own. */
function autoArchive() {
  let changed = false;
  for (const b of state.bookmarks) {
    if (b.archived) continue;
    const p = progressOf(b);
    if (p && p.fraction >= ARCHIVE_AT) { b.archived = true; changed = true; }
  }
  if (changed) save();
}

/* ── Gist sync ────────────────────────────────────────────────
   Bookmarks live in a secret gist so phone and laptop share one list.
   Needs a *classic* GitHub token with only the `gist` scope — fine-grained
   tokens still can't touch the Gists API.
   ──────────────────────────────────────────────────────────── */
const GIST_FILE = 'contilisten.json';

const GH = {
  get token()  { return DB.get('ghToken'); },
  set token(v) { v ? DB.set('ghToken', v) : DB.del('ghToken'); },
  get gistId() { return DB.get('ghGist'); },
  set gistId(v){ v ? DB.set('ghGist', v) : DB.del('ghGist'); },

  async call(path, method = 'GET', body) {
    const r = await fetch('https://api.github.com' + path, {
      method,
      headers: {
        Authorization: 'Bearer ' + GH.token,
        Accept: 'application/vnd.github+json',
        'X-GitHub-Api-Version': '2022-11-28',
        ...(body ? { 'Content-Type': 'application/json' } : {})
      },
      body: body ? JSON.stringify(body) : undefined
    });
    const text = await r.text();
    const data = text ? JSON.parse(text) : null;
    if (!r.ok) {
      const e = new Error(data?.message || r.statusText);
      e.status = r.status;
      throw e;
    }
    return data;
  }
};

const localPayload = () => ({
  version: 2,
  updatedAt: new Date().toISOString(),
  mode: state.mode,
  profiles: state.profiles,
  bookmarks: state.bookmarks,
  watchlist: state.watchlist,
  tombstones: DB.get('tombstones', {})
});

function mergePayload(remote, local) {
  const tomb = {};
  for (const k of new Set([...Object.keys(remote.tombstones || {}),
                           ...Object.keys(local.tombstones || {})])) {
    const a = remote.tombstones?.[k], b = local.tombstones?.[k];
    tomb[k] = t2n(a) > t2n(b) ? a : b;
  }
  // Forget deletions after 90 days so the file doesn't grow forever.
  const cutoff = Date.now() - 90 * 864e5;
  for (const k of Object.keys(tomb)) if (t2n(tomb[k]) < cutoff) delete tomb[k];

  const newest = (list, stamp) => {
    const m = new Map();
    for (const x of list) {
      const prev = m.get(x.id);
      if (!prev || t2n(x[stamp]) > t2n(prev[stamp])) m.set(x.id, x);
    }
    return [...m.values()];
  };

  const everyBookmark = [...(remote.bookmarks || []), ...(local.bookmarks || [])];
  // Newest wins for position, but keep whichever copy has the longer breadcrumb
  // trail — two devices sampling independently both hold real history.
  const bookmarks = newest(everyBookmark, 'updatedAt')
    .map(b => {
      const longest = everyBookmark
        .filter(x => x.id === b.id)
        .reduce((acc, x) => (x.history?.length || 0) > acc.length ? x.history : acc, b.history || []);
      return { ...b, history: (longest || []).slice(-HISTORY_CAP) };
    })
    .filter(b => !(tomb[b.id] && t2n(tomb[b.id]) >= t2n(b.updatedAt)))
    .sort((a, b) => t2n(b.updatedAt) - t2n(a.updatedAt));

  const watchlist = newest([...(remote.watchlist || []), ...(local.watchlist || [])], 'addedAt')
    .filter(w => !(tomb[w.id] && t2n(tomb[w.id]) >= t2n(w.addedAt)));

  const remoteNewer = t2n(remote.updatedAt) > t2n(local.updatedAt);
  const profiles = [...new Set([...(remote.profiles || []), ...(local.profiles || []), 'Me'])];

  return { version: 2, updatedAt: new Date().toISOString(),
           mode: remoteNewer ? (remote.mode || local.mode) : local.mode,
           profiles, bookmarks, watchlist, tombstones: tomb };
}

/// Second device only needs the token — this finds the gist the first one made.
async function findGist() {
  const gists = await GH.call('/gists?per_page=100');
  const hit = (gists || []).find(g => g.files && g.files[GIST_FILE]);
  return hit ? hit.id : null;
}

let syncTimer = null, syncing = false;

function scheduleSync() {
  if (!GH.token) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(() => sync(), 6000);   // debounce; poll writes often
}

async function sync(manual) {
  if (!GH.token || syncing) return;
  syncing = true;
  if (manual) render();
  try {
    if (!GH.gistId) GH.gistId = await findGist();

    let remote = {};
    if (GH.gistId) {
      const gist = await GH.call('/gists/' + GH.gistId);
      const file = gist.files?.[GIST_FILE];
      if (file) {
        const content = file.truncated ? await (await fetch(file.raw_url)).text() : file.content;
        remote = JSON.parse(content || '{}');
      }
    }

    const merged = mergePayload(remote, localPayload());
    state.bookmarks = merged.bookmarks;
    state.watchlist = merged.watchlist;
    state.mode = merged.mode || state.mode;
    state.profiles = merged.profiles;
    DB.set('tombstones', merged.tombstones);
    save({ noSync: true });

    const body = { files: { [GIST_FILE]: { content: JSON.stringify(merged, null, 2) } } };
    if (GH.gistId) {
      await GH.call('/gists/' + GH.gistId, 'PATCH', body);
    } else {
      const created = await GH.call('/gists', 'POST',
        { description: 'ContiListen bookmarks', public: false, ...body });
      GH.gistId = created.id;
    }

    DB.set('lastSync', new Date().toISOString());
    autoArchive();
    render();
    if (sheet().open && refreshSheet) refreshSheet();
    if (manual) toast('Synced');
  } catch (e) {
    if (e.status === 401) toast('GitHub token rejected — check it in Settings.', true);
    else if (e.status === 403) toast('Token lacks the gist scope.', true);
    else if (manual) toast('Sync failed: ' + e.message, true);
  } finally {
    syncing = false;
    if (manual) render();
  }
}

async function connectGist(token) {
  GH.token = token.trim();
  GH.gistId = null;
  try {
    const me = await GH.call('/user');
    toast('Connected as ' + me.login);
    await sync(true);
    openSettings();
  } catch (e) {
    GH.token = null;
    toast(e.status === 401 ? 'That token was rejected.' : e.message, true);
    openSettings();
  }
}

function disconnectGist() {
  GH.token = null;
  GH.gistId = null;
  DB.del('lastSync');
  toast('Sync turned off. Bookmarks stay on this device.');
  openSettings();
}

/* ── Player ───────────────────────────────────────────────── */

/** Normalises a track, a podcast episode or an audiobook chapter into one shape.
    Each carries a different parent field: album, show, audiobook. */
function describeItem(d) {
  const it = d.item;
  const parent = it.album || it.show || it.audiobook || null;
  const imgs = it.images || parent?.images || [];
  const people = it.artists || it.authors || [];
  const kind = it.type === 'chapter' ? 'chapter'
             : it.type === 'episode' ? (it.audiobook ? 'chapter' : 'episode')
             : 'track';

  return {
    trackURI: it.uri,
    trackName: it.name,
    trackNumber: it.track_number ?? it.chapter_number ?? null,
    durationMs: it.duration_ms || 0,
    positionMs: d.progress_ms || 0,
    isPlaying: !!d.is_playing,
    contextURI: d.context?.uri || null,
    albumURI: parent?.uri || null,
    albumName: parent?.name || it.name,
    artistName: people[0]?.name || parent?.publisher || '',
    artistURI: people[0]?.uri || null,
    art: (imgs.length > 1 ? imgs[1] : imgs[0])?.url || null,
    kind
  };
}
async function poll() {
  if (!state.signedIn) return;
  try {
    const d = await api('/v1/me/player?additional_types=episode');
    if (!d || !d.item) { state.nowPlaying = null; return render(); }
    state.nowPlaying = describeItem(d);
    record(state.nowPlaying);
    render();
    warmAlbums();
  } catch (e) {
    if (e.message === 'NOT_SIGNED_IN') { state.signedIn = false; render(); }
  }
}

/* ── Devices ──────────────────────────────────────────────── */
const DEVICE_ICON = {
  Computer:'💻', Smartphone:'📱', Tablet:'📱', Speaker:'🔊', TV:'📺', AVR:'🎛',
  STB:'📺', AudioDongle:'🔌', GameConsole:'🎮', CastVideo:'📺', CastAudio:'🔊',
  Automobile:'🚗'
};
const deviceIcon = t => DEVICE_ICON[t] || '🎵';

// Things in another room. Never auto-selected, even when Spotify calls them active —
// an idle Echo stays "active" for hours after you stop using it.
const FAR = new Set(['Speaker','CastAudio','CastVideo','TV','AVR','STB','GameConsole','AudioDongle']);

const listDevices = async () =>
  ((await api('/v1/me/player/devices'))?.devices || []).filter(x => x.id);

function rank(d) {
  const far = FAR.has(d.type);
  if (d.is_active && !far) return 0;
  if (d.type === 'Smartphone' || d.type === 'Tablet') return 1;
  if (d.type === 'Computer') return 2;
  if (d.is_active) return 3;
  return 4;
}

async function resolveDevice() {
  const list = await listDevices();
  const pinned = DB.get('pinnedDevice');
  if (pinned) {
    const hit = list.find(x => x.id === pinned.id);
    if (hit) return { device: hit };
    return { device: null, reason: 'offline', pinned };
  }
  if (!list.length) return { device: null, reason: 'empty' };
  return { device: [...list].sort((a, b) => rank(a) - rank(b))[0] };
}

async function startPlayback(payload, label) {
  if (state.busy) return;
  state.busy = true; render();
  try {
    const r = await resolveDevice();
    if (!r.device) {
      toast(r.reason === 'offline'
        ? `${r.pinned.name} isn't awake. Opening Spotify there — then tap again.`
        : 'No Spotify device found. Opening Spotify — then tap again.', true);
      location.href = 'spotify:';
      return;
    }
    if (!r.device.is_active) {
      try {
        await api('/v1/me/player', 'PUT', { device_ids: [r.device.id], play: false });
        await new Promise(res => setTimeout(res, 600));
      } catch (e) {}
    }
    try {
      await api('/v1/me/player/play?device_id=' + r.device.id, 'PUT', payload);
    } catch (err) {
      // Shows and audiobooks don't always accept a context. Play the item directly.
      if ((err.status === 400 || err.status === 404) && payload.context_uri && payload.offset?.uri) {
        await api('/v1/me/player/play?device_id=' + r.device.id, 'PUT',
          { uris: [payload.offset.uri], position_ms: payload.position_ms });
      } else throw err;
    }
    DB.set('lastDevice', r.device.id);
    toast(`Continuing ${label} on ${r.device.name}`);
    setTimeout(poll, 1200);
  } catch (e) {
    if (e.status === 404) {
      toast('Device went away. Opening Spotify — then tap again.', true);
      location.href = 'spotify:';
    } else if (e.status === 403) {
      toast('Spotify Premium is required to control playback.', true);
    } else {
      toast(e.message || 'Playback failed.', true);
    }
  } finally {
    state.busy = false; render();
  }
}

// Dropping back a few seconds re-establishes context — you've usually forgotten
// the last sentence by the time you come back to it.
const resume = b => {
  const pos = Math.max(0, b.positionMs - DB.get('rewindSec', 15) * 1000);
  return startPlayback(
    b.contextURI
      ? { context_uri: b.contextURI, offset: { uri: b.trackURI }, position_ms: pos }
      : { uris: [b.trackURI], position_ms: pos },
    b.albumName
  );
};
const byId = id => state.bookmarks.find(b => b.id === id);
const resumeById = id => { const b = byId(id); if (b) resume(b); };

const playAlbum = (uri, name) => startPlayback({ context_uri: uri, position_ms: 0 }, name);

/* ── Polling lifecycle ────────────────────────────────────── */
let pollTimer = null;
function startPolling() {
  stopPolling();
  if (!state.signedIn) return;
  poll();
  pollTimer = setInterval(() => {
    if (document.visibilityState === 'visible') poll();
  }, 5000);
}
function stopPolling() { if (pollTimer) clearInterval(pollTimer); pollTimer = null; }
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  poll();
  // Another device may have moved a bookmark while this tab was hidden.
  if (GH.token) sync();
});

/* ── Render ───────────────────────────────────────────────── */
function artHTML(url, cls) {
  return url
    ? `<img class="art ${cls||''}" src="${esc(url)}" alt="" loading="lazy">`
    : `<div class="art ${cls||''}">♪</div>`;
}

/** One saved Hörspiel. Album progress when the track map is known, chapter progress
    while it's still loading. */
const KIND_TAG = { episode: 'Podcast', chapter: 'Audiobook' };

function bookmarkRow(b) {
  const p = progressOf(b);
  const pct = p ? p.fraction : (b.durationMs ? b.positionMs / b.durationMs : 0);
  const percent = Math.round(pct * 100);

  const line2 = p && p.chapter
    ? `Chapter ${p.chapter} of ${p.chapters} · ${esc(b.trackName)}`
    : (KIND_TAG[b.kind] ? KIND_TAG[b.kind] + ' · ' : '')
      + (b.trackNumber && !KIND_TAG[b.kind] ? `Track ${b.trackNumber} · ` : '')
      + esc(b.trackName);

  const times = p ? `${clock(p.elapsed)} / ${clock(p.total)}`
                  : `${clock(b.positionMs)} / ${clock(b.durationMs)}`;

  return `<div class="row ${b.archived ? 'dimmed' : ''}" onclick="resumeById('${esc(b.id)}')">
    ${artHTML(b.art)}
    <div class="meta">
      <div class="t1">${esc(b.albumName)}</div>
      <div class="t2">${line2}</div>
      <div class="bar"><i style="width:${percent}%"></i></div>
      <div class="t3">
        <span><b style="color:var(--accent);font-weight:650">${percent}%</b> · ${times}</span>
        <span>${ago(b.updatedAt)}</span>
      </div>
    </div>
    <button class="more" onclick="event.stopPropagation();openBookmark('${esc(b.id)}')"
            aria-label="Options">⋯</button>
  </div>`;
}

function render() {
  const app = document.getElementById('app');

  if (!state.signedIn) {
    app.innerHTML = `
      <div class="signin">
        <div class="mark">🎧</div>
        <h3>Pick up where you stopped</h3>
        <p>Spotify only remembers your position in podcasts.
           ContiListen keeps a bookmark for Hörspiele too.</p>
        <button class="primary" onclick="signIn()">Connect Spotify</button>
      </div>`;
    return;
  }

  const np = state.nowPlaying;
  const nowHTML = np ? `
    <h2>Playing now</h2>
    <div class="card"><div class="row" style="cursor:default">
      ${artHTML(np.art)}
      <div class="meta">
        <div class="t1">${esc(np.albumName)}</div>
        <div class="t2">${esc(np.trackName)} · ${clock(np.positionMs)}</div>
      </div>
      <div class="chev">${np.isPlaying ? '▶' : '⏸'}</div>
    </div></div>` : '';

  const all = mine();
  const active = all.filter(b => !b.archived);
  const finished = all.filter(b => b.archived);

  const list = active.length ? active.map(bookmarkRow).join('')
    : `<div class="empty"><b>Nothing saved yet</b>Play an episode in Spotify, then come back to this page.</div>`;

  const pinned = DB.get('pinnedDevice');

  app.innerHTML = `
    <header>
      <h1>ContiListen</h1>
      <button class="iconbtn" onclick="openWatchlist()" title="Watchlist">★</button>
      <button class="iconbtn" onclick="openSettings()" title="Settings">⋯</button>
    </header>
    <div class="chips">
      <div class="chip" onclick="openProfiles()">👤 <b>${esc(state.profile)}</b></div>
      <div class="chip" onclick="openDevices()">🔈 <b>${pinned ? esc(pinned.name) : 'Automatic'}</b></div>
    </div>
    ${nowHTML}
    <h2>Continue</h2>
    <div class="card">${list}</div>
    ${finished.length ? `
      <h2 onclick="state.showArchived=!state.showArchived;render()" style="cursor:pointer">
        Finished <span class="count">${finished.length} ${state.showArchived ? '▾' : '▸'}</span>
      </h2>
      ${state.showArchived ? `<div class="card">${finished.map(bookmarkRow).join('')}</div>` : ''}
    ` : ''}
    ${state.busy ? '<div class="center">working…</div>' : ''}`;

  warmAlbums();
}

function untombstone(id) {
  const t = DB.get('tombstones', {});
  delete t[id];
  DB.set('tombstones', t);
}

/* ── Per-bookmark actions ─────────────────────────────────── */
function openBookmark(id) {
  const b = byId(id);
  if (!b) return;
  const p = progressOf(b);
  const n = (b.history || []).length;
  openSheet(b.albumName);
  document.getElementById('sheetBody').innerHTML = `
    <div class="card"><div class="row" style="cursor:default">
      ${artHTML(b.art)}
      <div class="meta">
        <div class="t1">${esc(b.albumName)}</div>
        <div class="t2">${esc(b.artistName)}</div>
        <div class="t3"><span>${p ? `Chapter ${p.chapter} of ${p.chapters}` : esc(b.trackName)}</span>
          <span>${clock(b.positionMs)}</span></div>
      </div>
    </div></div>

    <h2>Actions</h2>
    <div class="card">
      <div class="row" onclick="closeSheet();resumeById('${esc(b.id)}')">
        <div class="art">▶</div>
        <div class="meta"><div class="t1">Continue</div>
          <div class="t2">From ${clock(b.positionMs)}</div></div>
      </div>
      <div class="row" onclick="openHistory('${esc(b.id)}')">
        <div class="art">⟲</div>
        <div class="meta"><div class="t1">Jump back to earlier</div>
          <div class="t2">${n} saved position${n === 1 ? '' : 's'}</div></div>
      </div>
      <div class="row" onclick="toggleArchive('${esc(b.id)}')">
        <div class="art">${b.archived ? '↩' : '✓'}</div>
        <div class="meta"><div class="t1">${b.archived ? 'Move back to Continue' : 'Mark as finished'}</div>
          <div class="t2">${b.archived ? 'Un-archive this one' : 'Hide it in the Finished list'}</div></div>
      </div>
      <div class="row" onclick="forget('${esc(b.id)}')">
        <div class="art">✕</div>
        <div class="meta"><div class="t1" style="color:#ffb4b4">Forget</div>
          <div class="t2">Removes the bookmark on every device</div></div>
      </div>
    </div>`;
}

function toggleArchive(id) {
  const b = byId(id);
  if (!b) return;
  b.archived = !b.archived;
  b.updatedAt = new Date().toISOString();
  save(); closeSheet();
  toast(b.archived ? 'Moved to Finished' : 'Back in Continue');
}

function forget(id) {
  const i = state.bookmarks.findIndex(b => b.id === id);
  if (i < 0) return;
  const gone = state.bookmarks[i];
  tombstone(gone.id);
  state.bookmarks.splice(i, 1);
  save(); closeSheet();
  toast('Forgot ' + gone.albumName, false, { label: 'Undo', run() {
    untombstone(gone.id);
    // Re-stamp so the restore outranks the tombstone on other devices.
    gone.updatedAt = new Date().toISOString();
    state.bookmarks.unshift(gone);
    save(); render();
  }});
}

/* ── Position history ─────────────────────────────────────────
   The fell-asleep fix. Every poll leaves a breadcrumb, so an
   accidental all-night playthrough is recoverable.
   ──────────────────────────────────────────────────────────── */
function openHistory(id) {
  const b = byId(id);
  if (!b) return;
  openSheet('Jump back');

  const hist = [...(b.history || [])].reverse();
  const rows = hist.map((h, i) => `
    <div class="row" onclick="jumpBack('${esc(b.id)}',${i})">
      <div class="art" style="font-size:13px;font-weight:600">${esc(wallClock(h.t))}</div>
      <div class="meta">
        <div class="t1">${h.n ? 'Chapter ' + h.n : 'Earlier position'}</div>
        <div class="t2">${esc(dayLabel(h.t))} · ${clock(h.p)} into the chapter</div>
      </div>
      <div class="chev">▶</div>
    </div>`).join('');

  document.getElementById('sheetBody').innerHTML = `
    <p class="hint" style="margin-top:0">Positions recorded while you were listening,
       newest first. Fell asleep? Pick where you actually were.</p>
    <div class="card">${rows || `<div class="empty"><b>No history yet</b>
      Positions get saved as you listen.</div>`}</div>`;
}

function jumpBack(id, index) {
  const b = byId(id);
  if (!b) return;
  const h = [...(b.history || [])].reverse()[index];
  if (!h) return;

  const previous = { ...b };
  b.trackURI = h.u;
  b.trackNumber = h.n;
  b.positionMs = h.p;
  b.updatedAt = new Date().toISOString();
  b.archived = false;
  save();
  closeSheet();
  resume(b);

  toast('Jumped back to ' + wallClock(h.t), false, { label: 'Undo', run() {
    Object.assign(b, previous, { updatedAt: new Date().toISOString() });
    save(); render();
  }});
}

/* ── Profiles ─────────────────────────────────────────────── */
function openProfiles() {
  openSheet('Who is listening', openProfiles);
  const rows = knownProfiles().map(name => {
    const count = state.bookmarks.filter(b => (b.profile || 'Me') === name).length;
    const safe = esc(name).replace(/'/g, '&#39;');
    return `<div class="row" onclick="pickProfile('${safe}')">
      <div class="art">👤</div>
      <div class="meta"><div class="t1">${esc(name)}</div>
        <div class="t2">${count} bookmark${count === 1 ? '' : 's'}</div></div>
      ${name === state.profile ? '<span class="tick">✓</span>'
        : (knownProfiles().length > 1
          ? `<button class="more" onclick="event.stopPropagation();deleteProfile('${safe}')">✕</button>`
          : '')}
    </div>`;
  }).join('');

  document.getElementById('sheetBody').innerHTML = `
    <div class="card">${rows}</div>
    <h2>Add someone</h2>
    <div style="display:flex;gap:8px">
      <input type="text" id="pname" placeholder="e.g. Anna">
      <button class="ghost" onclick="addProfile()">Add</button>
    </div>
    <p class="hint">Each profile keeps its own bookmarks, so you don't overwrite each other
       in the same series. Which profile is active is remembered per device, so your phone
       and your partner's can differ while still sharing one gist.</p>`;
}

function pickProfile(name) {
  state.profile = name;
  if (!state.profiles.includes(name)) { state.profiles.push(name); save(); }
  DB.set('profile', name);
  closeSheet();
  toast('Listening as ' + name);
}

function addProfile() {
  const el = document.getElementById('pname');
  const name = (el.value || '').trim();
  if (!name) return;
  if (!state.profiles.includes(name)) state.profiles.push(name);
  state.profile = name;
  save();
  el.value = '';
  openProfiles();
}

function deleteProfile(name) {
  if (knownProfiles().length < 2) return;
  const doomed = state.bookmarks.filter(b => (b.profile || 'Me') === name);
  const go = () => {
    doomed.forEach(b => tombstone(b.id));
    state.bookmarks = state.bookmarks.filter(b => (b.profile || 'Me') !== name);
    state.profiles = state.profiles.filter(x => x !== name);
    if (state.profile === name) state.profile = knownProfiles()[0] || 'Me';
    save();
    openProfiles();
  };
  if (doomed.length) {
    toast(`Delete ${name} and ${doomed.length} bookmark(s)?`, true, { label: 'Delete', run: go });
  } else go();
}

/* ── Sheets ───────────────────────────────────────────────── */
const sheet = () => document.getElementById('sheet');
let refreshSheet = null;      // redraw hook for whichever sheet is open
function openSheet(title, redraw) {
  document.getElementById('sheetTitle').textContent = title;
  refreshSheet = redraw || null;
  if (!sheet().open) sheet().showModal();
}
function closeSheet() { refreshSheet = null; sheet().close(); render(); }

// Tapping the dimmed area outside the sheet closes it.
document.getElementById('sheet').addEventListener('click', e => {
  if (e.target.id === 'sheet') closeSheet();
});

// Drag the grabber down to dismiss, the way iOS sheets behave.
(function () {
  const grab = document.getElementById('grabber');
  const panel = grab.parentElement;
  let y0 = null;
  const move = dy => panel.style.transform = dy > 0 ? `translateY(${dy}px)` : '';
  grab.addEventListener('touchstart', e => { y0 = e.touches[0].clientY; }, { passive: true });
  grab.addEventListener('touchmove', e => {
    if (y0 === null) return;
    move(e.touches[0].clientY - y0);
  }, { passive: true });
  grab.addEventListener('touchend', e => {
    const dy = (e.changedTouches[0].clientY - (y0 ?? 0));
    y0 = null;
    panel.style.transform = '';
    if (dy > 90) closeSheet();
  });
})();

function openSettings() {
  const last = DB.get('lastSync');
  const on = !!GH.token;
  openSheet('Settings');
  document.getElementById('sheetBody').innerHTML = `
    <h2 style="margin-top:0">Sync across devices</h2>
    ${on ? `
      <div class="card"><div class="row" style="cursor:default">
        <div class="art">☁️</div>
        <div class="meta">
          <div class="t1">Gist sync is on</div>
          <div class="t2">${last ? 'Last synced ' + ago(last) : 'Not synced yet'}</div>
        </div>
      </div></div>
      <div style="display:flex;gap:8px;margin-top:10px">
        <button class="ghost" style="flex:1" onclick="sync(true)">${syncing ? 'Syncing…' : 'Sync now'}</button>
        <button class="ghost" style="flex:1" onclick="disconnectGist()">Disconnect</button>
      </div>
      ${GH.gistId ? `<p class="hint">Stored in secret gist
        <a href="https://gist.github.com/${esc(GH.gistId)}" target="_blank"
           style="color:var(--accent)">${esc(GH.gistId.slice(0, 8))}…</a></p>` : ''}
    ` : `
      <p class="hint">Bookmarks are stored per browser. Connect a GitHub token and they'll
         live in a secret gist instead — shared by every device you paste the same token into.</p>
      <div style="display:flex;gap:8px;margin-top:10px">
        <input type="text" id="ghtok" placeholder="ghp_… classic token"
               autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
        <button class="ghost" onclick="connectGist(document.getElementById('ghtok').value)">Connect</button>
      </div>
      <p class="hint">Create one at <b>github.com → Settings → Developer settings →
         Personal access tokens → Tokens (classic)</b>, ticking <b>only</b> the
         <b>gist</b> scope. Fine-grained tokens can't reach the Gists API.</p>
    `}

    <h2>Rewind on resume</h2>
    <div class="seg">
      ${[0, 5, 15, 30].map(n => `<button class="${DB.get('rewindSec', 15) === n ? 'on' : ''}"
         onclick="DB.set('rewindSec',${n});openSettings()">${n ? n + 's' : 'Off'}</button>`).join('')}
    </div>
    <p class="hint">Starts playback slightly before where you stopped, so you don't
       come back mid-sentence.</p>

    <h2>Remember</h2>
    <div class="seg">
      <button class="${state.mode === 'everything' ? 'on' : ''}" onclick="setMode('everything')">Everything I play</button>
      <button class="${state.mode === 'watchlist' ? 'on' : ''}" onclick="setMode('watchlist')">Watchlist only</button>
    </div>
    <p class="hint">${state.mode === 'watchlist'
      ? 'Only artists, albums and keywords on your watchlist get bookmarked.'
      : 'Every album you play gets a bookmark. Tap ✕ on a row to forget it.'}</p>

    <h2>Storage</h2>
    <p class="hint">${DB.ok
      ? (on
        ? 'Also in your gist, so a Safari data purge is recoverable — reconnect and it pulls everything back.'
        : 'Bookmarks live in this browser only. iOS clears site data after about 7 days of not visiting.')
      : 'Private browsing blocks storage, so bookmarks will vanish when you close this tab.'}</p>

    <div style="margin-top:22px"><button class="primary" style="background:#3a1f1f;color:#ffb4b4" onclick="signOut();closeSheet()">Sign out of Spotify</button></div>`;
}
function setMode(m) { state.mode = m; save(); openSettings(); }

/* ── Device picker ────────────────────────────────────────── */
async function openDevices() {
  openSheet('Play on');
  document.getElementById('sheetBody').innerHTML = '<div class="center">Looking for devices…</div>';
  try { drawDevices(await listDevices()); }
  catch (e) { drawDevices([]); toast(e.message, true); }
}

function drawDevices(list) {
  const pinned = DB.get('pinnedDevice');
  const rows = list.map(d => {
    const on = pinned && pinned.id === d.id;
    return `<div class="row" onclick="pinDevice('${d.id}','${esc(d.name).replace(/'/g,"&#39;")}')">
      <div class="art">${deviceIcon(d.type)}</div>
      <div class="meta">
        <div class="t1">${esc(d.name)}</div>
        <div class="t2">${esc(d.type)}${d.is_active ? ' · active now' : ''}</div>
      </div>
      ${on ? '<span class="tick">✓</span>' : ''}
    </div>`;
  }).join('');

  document.getElementById('sheetBody').innerHTML = `
    <div class="card">
      <div class="row" onclick="clearPin()">
        <div class="art">✨</div>
        <div class="meta">
          <div class="t1">Automatic</div>
          <div class="t2">Prefers a phone or computer over a speaker</div>
        </div>
        ${!pinned ? '<span class="tick">✓</span>' : ''}
      </div>
    </div>
    <h2>Your devices</h2>
    <div class="card">${rows || `<div class="empty"><b>Nothing awake</b>
      Spotify only lists a device while its app is open or recently used.</div>`}</div>
    <div class="center" style="gap:8px">
      <button class="ghost" onclick="openDevices()">Refresh</button>
      <button class="ghost" onclick="location.href='spotify:'">Open Spotify here</button>
    </div>
    <p class="hint">Pinning a device makes every resume go there. If it's asleep the app
       will offer to wake Spotify instead of quietly picking something in another room.</p>`;
}

function pinDevice(id, name) {
  DB.set('pinnedDevice', { id, name });
  toast('Playback will go to ' + name);
  openDevices();
}
function clearPin() { DB.del('pinnedDevice'); toast('Back to automatic'); openDevices(); }

/* ── Stale bookmark recovery ──────────────────────────────── */
// Spotify returns 204 from /me/player once it goes idle, so a position listened to
// hours ago is unreadable. recently-played still lists chapters that finished, which
// at least reveals the bookmark is behind. We advance it to the start of the last
// chapter Spotify saw finish — a few minutes of replay rather than an hour lost.
async function reconcile() {
  try {
    const items = (await api('/v1/me/player/recently-played?limit=50'))?.items || [];
    if (!items.length) return;
    let changed = false;

    for (const b of mine()) {
      const key = b.contextURI || b.key || b.id;
      const plays = items.filter(it =>
        (it.context?.uri === key || it.track?.album?.uri === key) &&
        new Date(it.played_at) > new Date(b.updatedAt));
      if (!plays.length) continue;

      const newest = plays.reduce((a, x) =>
        new Date(x.played_at) > new Date(a.played_at) ? x : a);
      b.trackURI    = newest.track.uri;
      b.trackName   = newest.track.name;
      b.trackNumber = newest.track.track_number;
      b.durationMs  = newest.track.duration_ms;
      b.positionMs  = 0;
      b.updatedAt   = newest.played_at;
      b.history     = pushHistory(b.history, b);
      changed = true;
    }
    if (changed) {
      state.bookmarks.sort((a, b) => t2n(b.updatedAt) - t2n(a.updatedAt));
      save(); autoArchive(); render();
      toast('Caught up from Spotify history');
    }
  } catch (e) { /* scope may be missing until you sign in again */ }
}

/* ── Watchlist ────────────────────────────────────────────── */
let searchTimer;
function openWatchlist() {
  openSheet('Watchlist');
  drawWatchlist();
}

function drawWatchlist(results) {
  const body = document.getElementById('sheetBody');
  const resHTML = (results || []).map((r, i) => {
    const on = state.watchlist.some(w => w.uri === r.uri);
    return `<div class="row">
      ${artHTML(r.art)}
      <div class="meta"><div class="t1">${esc(r.name)}</div><div class="t2">${esc(r.subtitle)}</div></div>
      ${on ? '<span class="tick">✓</span>'
           : `<button class="addbtn" onclick='addWatch(${JSON.stringify(r).replace(/'/g,"&#39;")})'>＋</button>`}
    </div>`;
  }).join('');

  const wl = state.watchlist.length ? state.watchlist.map((w, i) => `
    <div class="row" ${(w.kind === 'artist' || w.kind === 'show') ? `onclick="browseWatch(${i})"` :
                       (w.kind === 'album' || w.kind === 'audiobook') ? `onclick="openWatched(${i})"` :
                       'style="cursor:default"'}>
      ${w.kind === 'keyword' ? '<div class="art">🔍</div>' : artHTML(w.art)}
      <div class="meta"><div class="t1">${esc(w.name)}</div><div class="t2">${w.kind}</div></div>
      <button class="more" onclick="event.stopPropagation();removeWatch(${i})" aria-label="Remove">✕</button>
    </div>`).join('')
    : '<div class="empty">Add “Die drei ???”, “Sherlock Holmes”, or any artist you want tracked.</div>';

  body.innerHTML = `
    <input type="search" id="q" placeholder="Search artists and albums" value="${esc(currentQuery)}"
           autocomplete="off" autocorrect="off">
    ${results ? `<h2>Results</h2><div class="card">${resHTML || '<div class="empty">Nothing found.</div>'}</div>` : ''}
    <h2>Following</h2>
    <div class="card">${wl}</div>
    <h2>Add by name</h2>
    <div style="display:flex;gap:8px">
      <input type="text" id="kw" placeholder="e.g. Die drei ???">
      <button class="ghost" onclick="addKeyword()">Add</button>
    </div>
    <p class="hint">A keyword matches the artist, album or track title — useful when
       Spotify spells a series differently than you'd search for it.</p>`;

  const q = document.getElementById('q');
  q.oninput = () => {
    currentQuery = q.value;
    clearTimeout(searchTimer);
    searchTimer = setTimeout(runSearch, 350);
  };
}

let currentQuery = '';
async function runSearch() {
  const term = currentQuery.trim();
  if (term.length < 2) return drawWatchlist();
  try {
    const d = await api('/v1/search?type=artist,album,show,audiobook&limit=8&q='
      + encodeURIComponent(term));
    const pick = list => list || [];
    const out = [
      ...pick(d.artists?.items).map(a => ({
        kind: 'artist', id: a.id, uri: a.uri, name: a.name,
        subtitle: 'Artist', art: a.images?.slice(-1)[0]?.url || null })),
      ...pick(d.shows?.items).map(a => ({
        kind: 'show', id: a.id, uri: a.uri, name: a.name,
        subtitle: 'Podcast · ' + (a.publisher || ''), art: a.images?.slice(-1)[0]?.url || null })),
      ...pick(d.audiobooks?.items).map(a => ({
        kind: 'audiobook', id: a.id, uri: a.uri, name: a.name,
        subtitle: 'Audiobook · ' + (a.authors?.[0]?.name || ''),
        art: a.images?.slice(-1)[0]?.url || null })),
      ...pick(d.albums?.items).map(a => ({
        kind: 'album', id: a.id, uri: a.uri, name: a.name,
        subtitle: a.artists?.[0]?.name || 'Album', art: a.images?.slice(-1)[0]?.url || null }))
    ];
    drawWatchlist(out);
    document.getElementById('q').focus();
  } catch (e) { toast(e.message, true); }
}

function addWatch(r) {
  if (!state.watchlist.some(w => w.uri === r.uri)) {
    state.watchlist.unshift({ kind: r.kind, id: r.uri, uri: r.uri, name: r.name,
                              art: r.art, spotifyId: r.id, addedAt: new Date().toISOString() });
    save();
  }
  runSearch();
}
function removeWatch(i) {
  const gone = state.watchlist[i];
  tombstone(gone.id);
  state.watchlist.splice(i, 1);
  save(); drawWatchlist();
  toast('Removed ' + gone.name, false, { label: 'Undo', run() {
    untombstone(gone.id);
    gone.addedAt = new Date().toISOString();
    state.watchlist.unshift(gone);
    save(); drawWatchlist();
  }});
}
function addKeyword() {
  const el = document.getElementById('kw');
  const t = el.value.trim();
  if (t.length < 2) return;
  state.watchlist.unshift({ kind: 'keyword', id: 'kw:' + t.toLowerCase(), uri: null,
                            name: t, art: null, addedAt: new Date().toISOString() });
  save(); el.value = ''; drawWatchlist();
}

function openWatched(i) {
  const w = state.watchlist[i];
  const b = mine().find(x => x.key === w.uri || x.contextURI === w.uri);
  closeSheet();
  b ? resume(b) : playAlbum(w.uri, w.name);

}

/* ── Episode browser: an artist's releases, or a podcast's episodes ── */
let browse = { source: null, items: [], offset: 0, done: false };

async function browseWatch(i) {
  const w = state.watchlist[i];
  browse = { source: { ...w, id: w.spotifyId || String(w.id).split(':').pop() },
             items: [], offset: 0, done: false };
  openSheet(w.name);
  document.getElementById('sheetBody').innerHTML = '<div class="center">Loading…</div>';
  await loadEpisodes();
}

async function loadEpisodes() {
  if (browse.done) return;
  const src = browse.source;
  try {
    const path = src.kind === 'show'
      ? `/v1/shows/${src.id}/episodes?limit=50&offset=${browse.offset}`
      : `/v1/artists/${src.id}/albums?include_groups=album,single&limit=50&offset=${browse.offset}`;

    const d = await api(path);
    const items = (d.items || []).filter(Boolean).map(a => ({
      id: a.id, uri: a.uri, name: a.name,
      year: (a.release_date || '').slice(0, 4),
      art: a.images?.slice(-1)[0]?.url || null
    }));
    browse.items = browse.items.concat(items);
    browse.offset += items.length;
    if (items.length < 50) browse.done = true;
    // Podcast episodes already arrive newest-first; album releases need sorting.
    if (src.kind !== 'show') {
      browse.items.sort((a, b) => (b.year || '').localeCompare(a.year || ''));
    }
    drawEpisodes();
  } catch (e) { toast(e.message, true); }
}

function drawEpisodes() {
  const rows = browse.items.map((e, i) => {
    const b = mine().find(x => x.key === e.uri || x.contextURI === e.uri || x.trackURI === e.uri);
    const p = b ? progressOf(b) : null;
    return `<div class="row" onclick="openEpisode(${i})">
      ${artHTML(e.art)}
      <div class="meta">
        <div class="t1">${esc(e.name)}</div>
        <div class="t2" style="${b ? 'color:var(--accent)' : ''}">
          ${b ? (p && p.chapter ? `Continue · chapter ${p.chapter} of ${p.chapters}`
                                : `Continue at ${clock(b.positionMs)}`
                                  + (p ? ` · ${Math.round(p.fraction * 100)}%` : ''))
              : esc(e.year)}
        </div>
      </div>
      <div class="chev">▶</div>
    </div>`;
  }).join('');

  document.getElementById('sheetBody').innerHTML = `
    <div class="card">${rows || '<div class="empty">No releases found.</div>'}</div>
    ${browse.done ? '' : '<div class="center"><button class="ghost" onclick="loadEpisodes()">Load more</button></div>'}`;
}

function openEpisode(i) {
  const e = browse.items[i];
  const b = mine().find(x => x.key === e.uri || x.contextURI === e.uri || x.trackURI === e.uri);
  closeSheet();
  if (b) return resume(b);
  // A podcast episode is played directly; an album plays as a context.
  return e.uri.includes(':episode:')
    ? startPlayback({ uris: [e.uri], position_ms: 0 }, e.name)
    : playAlbum(e.uri, e.name);
}

/* ── Boot ─────────────────────────────────────────────────── */
(async function init() {
  await handleRedirect();
  state.signedIn = !!DB.get('refresh');
  autoArchive();
  render();
  if (state.signedIn) { startPolling(); reconcile(); }
  if (GH.token) sync();

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
</script>
