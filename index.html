<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ContiListen</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ContiListen">
<meta name="theme-color" content="#0b0f0d">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%23122a21'/%3E%3Ccircle cx='90' cy='90' r='56' fill='none' stroke='%23263a30' stroke-width='13'/%3E%3Cpath d='M90 34a56 56 0 1 1-39.6 95.6' fill='none' stroke='%231DB954' stroke-width='13' stroke-linecap='round'/%3E%3Cpath d='M76 62l42 28-42 28z' fill='%23f5faf7'/%3E%3C/svg%3E">

<style>
  :root{
    --bg:#0b0f0d; --surface:#131a17; --surface-2:#1b2420;
    --line:#243029; --text:#eef3f0; --dim:#8b9a92; --accent:#1db954;
    --radius:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text);
    font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    overscroll-behavior-y:contain;
  }
  .wrap{max-width:620px;margin:0 auto;padding:14px 14px 90px}

  header{display:flex;align-items:center;gap:10px;padding:8px 2px 16px}
  header h1{font-size:19px;font-weight:650;letter-spacing:-.02em;margin:0;flex:1}
  .iconbtn{
    background:var(--surface-2);border:1px solid var(--line);color:var(--text);
    width:38px;height:38px;border-radius:11px;font-size:17px;display:grid;place-items:center;cursor:pointer
  }
  .iconbtn:active{background:#243029}

  h2{font-size:12px;font-weight:650;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);margin:22px 2px 9px}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  .row{display:flex;gap:12px;padding:12px;align-items:center;border-bottom:1px solid var(--line);cursor:pointer}
  .row:last-child{border-bottom:none}
  .row:active{background:var(--surface-2)}
  .art{width:54px;height:54px;border-radius:8px;background:var(--surface-2);object-fit:cover;flex:none;
       display:grid;place-items:center;color:var(--dim);font-size:19px}
  .meta{flex:1;min-width:0}
  .t1{font-weight:600;font-size:15px;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .t2{color:var(--dim);font-size:13px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .t3{color:var(--dim);font-size:11.5px;margin-top:5px;font-variant-numeric:tabular-nums;display:flex;justify-content:space-between;gap:8px}
  .bar{height:3px;background:var(--surface-2);border-radius:2px;margin-top:7px;overflow:hidden}
  .bar>i{display:block;height:100%;background:var(--accent);border-radius:2px}
  .chev{color:var(--accent);font-size:22px;flex:none}

  .empty{padding:26px 18px;text-align:center;color:var(--dim);font-size:14px}
  .empty b{display:block;color:var(--text);font-size:15px;margin-bottom:6px}

  button.primary{
    background:var(--accent);color:#04140c;border:none;border-radius:12px;
    padding:13px 20px;font-size:15px;font-weight:650;width:100%;cursor:pointer
  }
  button.primary:active{filter:brightness(.9)}
  button.ghost{background:var(--surface-2);border:1px solid var(--line);color:var(--text);
    border-radius:10px;padding:9px 14px;font-size:13.5px;font-weight:600;cursor:pointer}

  .signin{text-align:center;padding:56px 20px}
  .signin .mark{font-size:52px;margin-bottom:18px}
  .signin h3{font-size:21px;margin:0 0 10px;letter-spacing:-.02em}
  .signin p{color:var(--dim);font-size:14.5px;margin:0 0 26px}

  .toast{
    position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom));
    background:var(--surface-2);border:1px solid var(--line);color:var(--text);
    padding:11px 16px;border-radius:12px;font-size:13.5px;max-width:min(92vw,460px);
    box-shadow:0 10px 30px #0009;z-index:60;opacity:0;pointer-events:none;transition:opacity .18s
  }
  .toast.on{opacity:1}
  .toast.warn{border-color:#5a4a1e;color:#f2d98d}

  dialog{
    border:none;padding:0;background:var(--bg);color:var(--text);width:100%;max-width:620px;
    height:100%;max-height:100%;margin:0 auto
  }
  dialog::backdrop{background:#000c}
  .sheet{display:flex;flex-direction:column;height:100dvh}
  .sheethead{display:flex;gap:10px;align-items:center;padding:14px;border-bottom:1px solid var(--line)}
  .sheethead h3{margin:0;font-size:17px;flex:1;letter-spacing:-.01em}
  .sheetbody{flex:1;overflow-y:auto;padding:14px;-webkit-overflow-scrolling:touch}
  input[type=search],input[type=text]{
    width:100%;background:var(--surface);border:1px solid var(--line);color:var(--text);
    border-radius:11px;padding:12px 14px;font-size:15px;outline:none
  }
  input:focus{border-color:var(--accent)}
  .addbtn{background:none;border:none;color:var(--accent);font-size:25px;cursor:pointer;padding:0 4px}
  .tick{color:var(--accent);font-size:19px}
  .seg{display:flex;gap:6px;margin:10px 0 4px}
  .seg button{flex:1;background:var(--surface);border:1px solid var(--line);color:var(--dim);
    padding:9px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer}
  .seg button.on{background:var(--surface-2);color:var(--text);border-color:var(--accent)}
  .hint{color:var(--dim);font-size:12.5px;margin:9px 2px 0;line-height:1.5}
  .center{display:flex;justify-content:center;padding:16px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>

<dialog id="sheet"><div class="sheet">
  <div class="sheethead">
    <h3 id="sheetTitle">Watchlist</h3>
    <button class="ghost" onclick="closeSheet()">Done</button>
  </div>
  <div class="sheetbody" id="sheetBody"></div>
</div></dialog>

<script>
/* ════════════════════════════════════════════════════════════
   CONFIG — paste your Spotify Client ID below.
   The redirect URI is this page's own URL; register it verbatim
   in the Spotify dashboard.
   ════════════════════════════════════════════════════════════ */
const CLIENT_ID = 'fcac2f6154a841bb8ac819f12823e994';

const REDIRECT_URI = location.origin + location.pathname;
const SCOPES = 'user-read-playback-state user-modify-playback-state user-read-currently-playing';
const API = 'https://api.spotify.com';

/* ── Storage ──────────────────────────────────────────────── */
const DB = (() => {
  let ok = true, mem = {};
  try { localStorage.setItem('_t','1'); localStorage.removeItem('_t'); }
  catch (e) { ok = false; }
  return {
    ok,
    get(k, d) {
      try {
        const v = ok ? localStorage.getItem(k) : mem[k];
        return v == null ? d : JSON.parse(v);
      } catch (e) { return d; }
    },
    set(k, v) {
      const s = JSON.stringify(v);
      if (ok) { try { localStorage.setItem(k, s); } catch (e) {} } else mem[k] = s;
    },
    del(k) { if (ok) localStorage.removeItem(k); else delete mem[k]; }
  };
})();

let state = {
  bookmarks: DB.get('bookmarks', []),
  watchlist: DB.get('watchlist', []),
  mode:      DB.get('mode', 'everything'),
  nowPlaying: null,
  signedIn: false,
  busy: false
};
const save = () => {
  DB.set('bookmarks', state.bookmarks);
  DB.set('watchlist', state.watchlist);
  DB.set('mode', state.mode);
};

/* ── Helpers ──────────────────────────────────────────────── */
const clock = ms => {
  const t = Math.max(0, Math.floor(ms / 1000));
  const h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), s = t % 60;
  return h ? `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`
           : `${m}:${String(s).padStart(2,'0')}`;
};
const ago = iso => {
  const d = (Date.now() - new Date(iso)) / 1000;
  if (d < 90) return 'just now';
  if (d < 3600) return Math.round(d / 60) + 'm ago';
  if (d < 86400) return Math.round(d / 3600) + 'h ago';
  return Math.round(d / 86400) + 'd ago';
};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let toastTimer;
function toast(msg, warn) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast on' + (warn ? ' warn' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.className = 'toast', 3600);
}

/* ── PKCE auth ────────────────────────────────────────────── */
const b64url = buf => btoa(String.fromCharCode(...new Uint8Array(buf)))
  .replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');

async function signIn() {
  if (CLIENT_ID.startsWith('PASTE')) {
    return toast('Set CLIENT_ID at the top of index.html first.', true);
  }
  const bytes = new Uint8Array(64);
  crypto.getRandomValues(bytes);
  const verifier = b64url(bytes);
  DB.set('verifier', verifier);

  const challenge = b64url(
    await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier))
  );
  const q = new URLSearchParams({
    client_id: CLIENT_ID, response_type: 'code', redirect_uri: REDIRECT_URI,
    code_challenge_method: 'S256', code_challenge: challenge, scope: SCOPES
  });
  location.href = 'https://accounts.spotify.com/authorize?' + q;
}

async function tokenRequest(body) {
  const r = await fetch('https://accounts.spotify.com/api/token', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: new URLSearchParams(body)
  });
  const j = await r.json();
  if (!r.ok) {
    if (r.status === 400 || r.status === 401) signOut(true);
    throw new Error(j.error_description || j.error || 'Token request failed');
  }
  DB.set('access', j.access_token);
  DB.set('expires', Date.now() + (j.expires_in - 60) * 1000);
  if (j.refresh_token) DB.set('refresh', j.refresh_token);
  state.signedIn = true;
}

async function handleRedirect() {
  const p = new URLSearchParams(location.search);
  if (p.get('error')) {
    history.replaceState({}, '', REDIRECT_URI);
    toast('Spotify sign-in was cancelled.', true);
    return;
  }
  const code = p.get('code');
  if (!code) return;
  const verifier = DB.get('verifier');
  history.replaceState({}, '', REDIRECT_URI);
  if (!verifier) return;
  try {
    await tokenRequest({
      grant_type: 'authorization_code', code, redirect_uri: REDIRECT_URI,
      client_id: CLIENT_ID, code_verifier: verifier
    });
    DB.del('verifier');
  } catch (e) { toast(e.message, true); }
}

async function token() {
  const access = DB.get('access'), expires = DB.get('expires', 0);
  if (access && Date.now() < expires) return access;
  const refresh = DB.get('refresh');
  if (!refresh) throw new Error('NOT_SIGNED_IN');
  await tokenRequest({ grant_type: 'refresh_token', refresh_token: refresh, client_id: CLIENT_ID });
  return DB.get('access');
}

function signOut(quiet) {
  ['access','expires','refresh','verifier'].forEach(DB.del);
  state.signedIn = false;
  state.nowPlaying = null;
  stopPolling();
  render();
  if (!quiet) toast('Signed out.');
}

/* ── API ──────────────────────────────────────────────────── */
async function api(path, method = 'GET', body) {
  const t = await token();
  const r = await fetch(API + path, {
    method,
    headers: { Authorization: 'Bearer ' + t, ...(body ? {'Content-Type':'application/json'} : {}) },
    body: body ? JSON.stringify(body) : undefined
  });
  if (r.status === 204) return null;
  const text = await r.text();
  const data = text ? JSON.parse(text) : null;
  if (!r.ok) {
    const err = new Error(data?.error?.message || r.statusText);
    err.status = r.status;
    throw err;
  }
  return data;
}

/* ── Bookmarks ────────────────────────────────────────────── */
function watchMatches(np) {
  return state.watchlist.some(w => {
    const hay = (s, n) => (s || '').toLowerCase().includes(n.toLowerCase());
    if (w.kind === 'artist') return w.uri === np.artistURI || hay(np.artistName, w.name);
    if (w.kind === 'album')  return w.uri === np.albumURI || w.uri === np.contextURI;
    return hay(np.albumName, w.name) || hay(np.artistName, w.name) || hay(np.trackName, w.name);
  });
}

function record(np) {
  if (state.mode === 'watchlist' && !watchMatches(np)) return;
  const id = np.contextURI || np.albumURI || np.trackURI;
  const entry = { id, albumName: np.albumName, artistName: np.artistName, art: np.art,
                  contextURI: np.contextURI, trackURI: np.trackURI, trackName: np.trackName,
                  trackNumber: np.trackNumber, positionMs: np.positionMs,
                  durationMs: np.durationMs, updatedAt: new Date().toISOString() };
  const i = state.bookmarks.findIndex(b => b.id === id);
  if (i >= 0) {
    const old = state.bookmarks[i];
    // Don't let a fresh restart at 0:01 clobber a good position.
    if (old.trackURI === entry.trackURI && entry.positionMs < 3000 && old.positionMs > 10000) return;
    state.bookmarks[i] = entry;
  } else {
    if (np.positionMs < 3000 && !np.isPlaying) return;
    state.bookmarks.push(entry);
  }
  state.bookmarks.sort((a, b) => new Date(b.updatedAt) - new Date(a.updatedAt));
  save();
}

/* ── Player ───────────────────────────────────────────────── */
async function poll() {
  if (!state.signedIn) return;
  try {
    const d = await api('/v1/me/player');
    if (!d || !d.item) { state.nowPlaying = null; return render(); }
    const imgs = d.item.album?.images || [];
    state.nowPlaying = {
      trackURI: d.item.uri, trackName: d.item.name, trackNumber: d.item.track_number,
      durationMs: d.item.duration_ms, positionMs: d.progress_ms || 0, isPlaying: !!d.is_playing,
      contextURI: d.context?.uri || null, albumURI: d.item.album?.uri || null,
      albumName: d.item.album?.name || d.item.name,
      artistName: d.item.artists?.[0]?.name || '', artistURI: d.item.artists?.[0]?.uri || null,
      art: (imgs.length > 1 ? imgs[1] : imgs[0])?.url || null
    };
    record(state.nowPlaying);
    render();
  } catch (e) {
    if (e.message === 'NOT_SIGNED_IN') { state.signedIn = false; render(); }
  }
}

async function pickDevice() {
  const d = await api('/v1/me/player/devices');
  const list = (d?.devices || []).filter(x => x.id);
  if (!list.length) return null;
  const last = DB.get('lastDevice');
  const target = list.find(x => x.is_active)
    || list.find(x => x.id === last)
    || list.find(x => x.type === 'Smartphone')
    || list[0];
  if (!target.is_active) {
    try {
      await api('/v1/me/player', 'PUT', { device_ids: [target.id], play: false });
      await new Promise(r => setTimeout(r, 600));
    } catch (e) {}
  }
  DB.set('lastDevice', target.id);
  return target.id;
}

async function startPlayback(payload, label) {
  if (state.busy) return;
  state.busy = true; render();
  try {
    const dev = await pickDevice();
    if (!dev) {
      toast('No Spotify device. Opening Spotify — come back and tap again.', true);
      location.href = 'spotify:';
      return;
    }
    await api('/v1/me/player/play?device_id=' + dev, 'PUT', payload);
    toast('Continuing ' + label);
    setTimeout(poll, 1200);
  } catch (e) {
    if (e.status === 404) {
      toast('No active device. Opening Spotify — then tap again.', true);
      location.href = 'spotify:';
    } else if (e.status === 403) {
      toast('Spotify Premium is required to control playback.', true);
    } else {
      toast(e.message || 'Playback failed.', true);
    }
  } finally {
    state.busy = false; render();
  }
}

const resume = b => startPlayback(
  b.contextURI
    ? { context_uri: b.contextURI, offset: { uri: b.trackURI }, position_ms: b.positionMs }
    : { uris: [b.trackURI], position_ms: b.positionMs },
  b.albumName
);

const playAlbum = (uri, name) => startPlayback({ context_uri: uri, position_ms: 0 }, name);

/* ── Polling lifecycle ────────────────────────────────────── */
let pollTimer = null;
function startPolling() {
  stopPolling();
  if (!state.signedIn) return;
  poll();
  pollTimer = setInterval(() => {
    if (document.visibilityState === 'visible') poll();
  }, 5000);
}
function stopPolling() { if (pollTimer) clearInterval(pollTimer); pollTimer = null; }
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') poll();
});

/* ── Render ───────────────────────────────────────────────── */
function artHTML(url, cls) {
  return url
    ? `<img class="art ${cls||''}" src="${esc(url)}" alt="" loading="lazy">`
    : `<div class="art ${cls||''}">♪</div>`;
}

function render() {
  const app = document.getElementById('app');

  if (!state.signedIn) {
    app.innerHTML = `
      <div class="signin">
        <div class="mark">🎧</div>
        <h3>Pick up where you stopped</h3>
        <p>Spotify only remembers your position in podcasts.
           ContiListen keeps a bookmark for Hörspiele too.</p>
        <button class="primary" onclick="signIn()">Connect Spotify</button>
      </div>`;
    return;
  }

  const np = state.nowPlaying;
  const nowHTML = np ? `
    <h2>Playing now</h2>
    <div class="card"><div class="row" style="cursor:default">
      ${artHTML(np.art)}
      <div class="meta">
        <div class="t1">${esc(np.albumName)}</div>
        <div class="t2">${esc(np.trackName)} · ${clock(np.positionMs)}</div>
      </div>
      <div class="chev">${np.isPlaying ? '▶' : '⏸'}</div>
    </div></div>` : '';

  const list = state.bookmarks.length ? state.bookmarks.map((b, i) => `
    <div class="row" onclick="resume(state.bookmarks[${i}])">
      ${artHTML(b.art)}
      <div class="meta">
        <div class="t1">${esc(b.albumName)}</div>
        <div class="t2">${b.trackNumber ? 'Track ' + b.trackNumber + ' · ' : ''}${esc(b.trackName)}</div>
        <div class="bar"><i style="width:${Math.round((b.positionMs / (b.durationMs || 1)) * 100)}%"></i></div>
        <div class="t3"><span>${clock(b.positionMs)} / ${clock(b.durationMs)}</span><span>${ago(b.updatedAt)}</span></div>
      </div>
      <div class="chev" onclick="event.stopPropagation();removeBookmark(${i})" style="color:var(--dim)">✕</div>
    </div>`).join('')
    : `<div class="empty"><b>Nothing saved yet</b>Play an episode in Spotify, then come back to this page.</div>`;

  app.innerHTML = `
    <header>
      <h1>ContiListen</h1>
      <button class="iconbtn" onclick="openWatchlist()" title="Watchlist">★</button>
      <button class="iconbtn" onclick="openSettings()" title="Settings">⋯</button>
    </header>
    ${nowHTML}
    <h2>Continue</h2>
    <div class="card">${list}</div>
    ${state.busy ? '<div class="center">working…</div>' : ''}`;
}

function removeBookmark(i) {
  state.bookmarks.splice(i, 1);
  save(); render();
}

/* ── Sheets ───────────────────────────────────────────────── */
const sheet = () => document.getElementById('sheet');
function openSheet(title) {
  document.getElementById('sheetTitle').textContent = title;
  if (!sheet().open) sheet().showModal();
}
function closeSheet() { sheet().close(); render(); }

function openSettings() {
  openSheet('Settings');
  document.getElementById('sheetBody').innerHTML = `
    <h2 style="margin-top:0">Remember</h2>
    <div class="seg">
      <button class="${state.mode === 'everything' ? 'on' : ''}" onclick="setMode('everything')">Everything I play</button>
      <button class="${state.mode === 'watchlist' ? 'on' : ''}" onclick="setMode('watchlist')">Watchlist only</button>
    </div>
    <p class="hint">${state.mode === 'watchlist'
      ? 'Only artists, albums and keywords on your watchlist get bookmarked.'
      : 'Every album you play gets a bookmark. Swipe-free: tap ✕ on a row to forget it.'}</p>
    <h2>Storage</h2>
    <p class="hint">${DB.ok
      ? 'Bookmarks live in this browser only. iOS clears site data after about 7 days of not visiting, so open this page now and then — or add it to your Home Screen.'
      : 'Private browsing blocks storage, so bookmarks will vanish when you close this tab.'}</p>
    <div style="margin-top:22px"><button class="primary" style="background:#3a1f1f;color:#ffb4b4" onclick="signOut();closeSheet()">Sign out</button></div>`;
}
function setMode(m) { state.mode = m; save(); openSettings(); }

/* ── Watchlist ────────────────────────────────────────────── */
let searchTimer;
function openWatchlist() {
  openSheet('Watchlist');
  drawWatchlist();
}

function drawWatchlist(results) {
  const body = document.getElementById('sheetBody');
  const resHTML = (results || []).map((r, i) => {
    const on = state.watchlist.some(w => w.uri === r.uri);
    return `<div class="row">
      ${artHTML(r.art)}
      <div class="meta"><div class="t1">${esc(r.name)}</div><div class="t2">${esc(r.subtitle)}</div></div>
      ${on ? '<span class="tick">✓</span>'
           : `<button class="addbtn" onclick='addWatch(${JSON.stringify(r).replace(/'/g,"&#39;")})'>＋</button>`}
    </div>`;
  }).join('');

  const wl = state.watchlist.length ? state.watchlist.map((w, i) => `
    <div class="row" ${w.kind === 'artist' ? `onclick="browseArtist(${i})"` :
                       w.kind === 'album' ? `onclick="openWatched(${i})"` : 'style="cursor:default"'}>
      ${w.kind === 'keyword' ? '<div class="art">🔍</div>' : artHTML(w.art)}
      <div class="meta"><div class="t1">${esc(w.name)}</div><div class="t2">${w.kind}</div></div>
      <div class="chev" onclick="event.stopPropagation();removeWatch(${i})" style="color:var(--dim)">✕</div>
    </div>`).join('')
    : '<div class="empty">Add “Die drei ???”, “Sherlock Holmes”, or any artist you want tracked.</div>';

  body.innerHTML = `
    <input type="search" id="q" placeholder="Search artists and albums" value="${esc(currentQuery)}"
           autocomplete="off" autocorrect="off">
    ${results ? `<h2>Results</h2><div class="card">${resHTML || '<div class="empty">Nothing found.</div>'}</div>` : ''}
    <h2>Following</h2>
    <div class="card">${wl}</div>
    <h2>Add by name</h2>
    <div style="display:flex;gap:8px">
      <input type="text" id="kw" placeholder="e.g. Die drei ???">
      <button class="ghost" onclick="addKeyword()">Add</button>
    </div>
    <p class="hint">A keyword matches the artist, album or track title — useful when
       Spotify spells a series differently than you'd search for it.</p>`;

  const q = document.getElementById('q');
  q.oninput = () => {
    currentQuery = q.value;
    clearTimeout(searchTimer);
    searchTimer = setTimeout(runSearch, 350);
  };
}

let currentQuery = '';
async function runSearch() {
  const term = currentQuery.trim();
  if (term.length < 2) return drawWatchlist();
  try {
    const d = await api('/v1/search?type=artist,album&limit=12&q=' + encodeURIComponent(term));
    const out = [
      ...(d.artists?.items || []).map(a => ({
        kind: 'artist', id: a.id, uri: a.uri, name: a.name,
        subtitle: 'Artist', art: a.images?.slice(-1)[0]?.url || null })),
      ...(d.albums?.items || []).map(a => ({
        kind: 'album', id: a.id, uri: a.uri, name: a.name,
        subtitle: a.artists?.[0]?.name || 'Album', art: a.images?.slice(-1)[0]?.url || null }))
    ];
    drawWatchlist(out);
    document.getElementById('q').focus();
  } catch (e) { toast(e.message, true); }
}

function addWatch(r) {
  if (!state.watchlist.some(w => w.uri === r.uri)) {
    state.watchlist.unshift({ kind: r.kind, id: r.id, uri: r.uri, name: r.name, art: r.art });
    save();
  }
  runSearch();
}
function removeWatch(i) { state.watchlist.splice(i, 1); save(); drawWatchlist(); }
function addKeyword() {
  const el = document.getElementById('kw');
  const t = el.value.trim();
  if (t.length < 2) return;
  state.watchlist.unshift({ kind: 'keyword', id: 'kw:' + t.toLowerCase(), uri: null, name: t, art: null });
  save(); el.value = ''; drawWatchlist();
}

function openWatched(i) {
  const w = state.watchlist[i];
  const b = state.bookmarks.find(x => x.id === w.uri || x.contextURI === w.uri);
  b ? resume(b) : playAlbum(w.uri, w.name);
  closeSheet();
}

/* ── Artist episode browser ───────────────────────────────── */
let browse = { artist: null, items: [], offset: 0, done: false };

async function browseArtist(i) {
  const w = state.watchlist[i];
  browse = { artist: w, items: [], offset: 0, done: false };
  openSheet(w.name);
  document.getElementById('sheetBody').innerHTML = '<div class="center">Loading…</div>';
  await loadEpisodes();
}

async function loadEpisodes() {
  if (browse.done) return;
  try {
    const d = await api(`/v1/artists/${browse.artist.id}/albums?include_groups=album,single&limit=50&offset=${browse.offset}`);
    const items = (d.items || []).map(a => ({
      id: a.id, uri: a.uri, name: a.name,
      year: (a.release_date || '').slice(0, 4),
      art: a.images?.slice(-1)[0]?.url || null
    }));
    browse.items = browse.items.concat(items);
    browse.offset += items.length;
    if (items.length < 50) browse.done = true;
    browse.items.sort((a, b) => (b.year || '').localeCompare(a.year || ''));
    drawEpisodes();
  } catch (e) { toast(e.message, true); }
}

function drawEpisodes() {
  const rows = browse.items.map((e, i) => {
    const b = state.bookmarks.find(x => x.id === e.uri || x.contextURI === e.uri);
    return `<div class="row" onclick="openEpisode(${i})">
      ${artHTML(e.art)}
      <div class="meta">
        <div class="t1">${esc(e.name)}</div>
        <div class="t2" style="${b ? 'color:var(--accent)' : ''}">
          ${b ? 'Continue at ' + clock(b.positionMs) : esc(e.year)}
        </div>
      </div>
      <div class="chev">▶</div>
    </div>`;
  }).join('');

  document.getElementById('sheetBody').innerHTML = `
    <div class="card">${rows || '<div class="empty">No releases found.</div>'}</div>
    ${browse.done ? '' : '<div class="center"><button class="ghost" onclick="loadEpisodes()">Load more</button></div>'}`;
}

function openEpisode(i) {
  const e = browse.items[i];
  const b = state.bookmarks.find(x => x.id === e.uri || x.contextURI === e.uri);
  b ? resume(b) : playAlbum(e.uri, e.name);
  closeSheet();
}

/* ── Boot ─────────────────────────────────────────────────── */
(async function init() {
  await handleRedirect();
  state.signedIn = !!DB.get('refresh');
  render();
  if (state.signedIn) startPolling();
})();
</script>
</body>
