name = "contilisten"
main = "src/index.js"
compatibility_date = "2026-01-01"

# Every minute — the free plan's floor, and twelve times better than the
# GitHub Actions job this replaces. Waiting on fetch() doesn't count toward
# the free plan's CPU limit, so the polling stays well inside it.
[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "contilisten"
database_id = "ba256c41-dc45-4e34-948e-07055463b438"

[vars]
# Your Spotify app's Client ID, and where the PWA is served from.
SPOTIFY_CLIENT_ID = "fcac2f6154a841bb8ac819f12823e994"
APP_ORIGIN = "https://tillecki.github.io/contiListen/"

# Set the secret separately, never in this file:
#   wrangler secret put SPOTIFY_CLIENT_SECRET
