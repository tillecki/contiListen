name: ContiListen position poller

on:
  schedule:
    # Every 5 minutes — GitHub's minimum for scheduled workflows. Runs are often
    # late under load, so treat this as "roughly every 5-15 minutes".
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

# Never let two pollers write the gist at once.
concurrency:
  group: contilisten-poller
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      # v5+ runs on Node 24. Node 20 leaves the runners in September 2026,
      # so v4 would start failing rather than just warning.
      - uses: actions/checkout@v5

      - name: Record current playback position
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
          # Whose bookmarks these are. Must match a profile name in the app.
          PROFILE: ${{ vars.PROFILE || 'Me' }}
        run: python3 scripts/poll.py
